name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please never paste your token. For security problems use **Security → Report a vulnerability** instead.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The assistant and what you asked, or the tool call.
  - type: input
    id: version
    attributes:
      label: "@wheewise-mcp/dealer version"
  - type: input
    id: client
    attributes:
      label: MCP client and Node.js version
      placeholder: Claude Desktop 1.x, Node 22
  - type: textarea
    id: logs
    attributes:
      label: Logs (stderr from your assistant's MCP log)
      render: text
