name: Release

# Push a tag like v0.1.0 to publish. Needs an NPM_TOKEN repository secret (an npm automation token for the @wheewise scope).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: The tag must match package.json and server.json
        run: |
          v="${GITHUB_REF_NAME#v}"
          [ "$(node -p "require('./package.json').version")" = "$v" ] || { echo "::error::package.json version is not $v"; exit 1; }
          [ "$(node -p "require('./server.json').version")" = "$v" ] || { echo "::error::server.json version is not $v"; exit 1; }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: GitHub release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
