<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pre-owned vehicles</title>
    <meta name="description" content="Quality pre-owned vehicles. See what is in stock and book a test drive." />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <header class="top">
      <div class="wrap">
        <a class="brand" href="#/" id="shop-name">Our shop</a>
        <a class="cta" href="#contact">Enquire</a>
      </div>
    </header>

    <main id="view" class="wrap" aria-live="polite">
      <p class="muted">Loading…</p>
    </main>

    <footer id="contact" class="foot">
      <div class="wrap grid2">
        <div id="shop-info"></div>
        <form id="contact-form" class="form" novalidate>
          <h2>Send an enquiry</h2>
          <div id="contact-fields"></div>
          <p class="status" role="status"></p>
        </form>
      </div>
    </footer>
  </body>
</html>
